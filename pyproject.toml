[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stability-eval"
version = "0.1.0"
description = "Stability assertions for LLM prompts and agents — a DeepEval plugin"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["llm", "evaluation", "stability", "deepeval", "pytest", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "deepeval>=2.0.0",
    "litellm>=1.40.0",        # unified provider interface for cross-model
    "sentence-transformers>=2.2.0",  # for semantic similarity
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/yourname/stability-eval"
Issues = "https://github.com/yourname/stability-eval/issues"

[project.entry-points."deepeval.metrics"]
pass_n = "stability_eval.metrics:PassNMetric"
cross_model = "stability_eval.metrics:CrossModelAgreementMetric"
perturbation = "stability_eval.metrics:PerturbationStabilityMetric"

[tool.hatch.build.targets.wheel]
packages = ["src/stability_eval"]
